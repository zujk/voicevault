name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installa cmdline-tools e accetta le licenze, cosi' AGP puo' scaricare
      # da solo la platform che gli serve se l'immagine del runner non l'ha.
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila la APK di debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Carica la APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voicevault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
