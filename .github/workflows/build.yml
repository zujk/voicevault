name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # L'immagine del runner ha gia' l'SDK: serve solo accettare le licenze e
      # assicurarsi che ci siano la platform e i build-tools che usa il progetto.
      # Non si usa android-actions/setup-android perche' prova a installare il
      # pacchetto "tools", che Google ha ritirato.
      - name: Platform e build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila la APK di debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Carica la APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voicevault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
