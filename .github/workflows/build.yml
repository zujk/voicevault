name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # L'immagine del runner ha gia' l'SDK: serve solo accettare le licenze e
      # assicurarsi che ci siano la platform e i build-tools che usa il progetto.
      # Non si usa android-actions/setup-android perche' prova a installare il
      # pacchetto "tools", che Google ha ritirato.
      - name: Platform e build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # Gli esempi audio sono stati spediti una volta completamente muti: il
      # file era valido e della dimensione giusta, ma ogni campione era a
      # -91 dB. Qui si misura ogni clip e si rifiuta la build se e' silenzio.
      - name: Gli esempi audio non devono essere muti
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          fail=0
          for f in app/src/main/res/raw/*.mp3; do
            mean=$(ffmpeg -v info -i "$f" -af volumedetect -f null - 2>&1 \
              | sed -n 's/.*mean_volume: \(-*[0-9.]*\) dB.*/\1/p' | head -1)
            if [ -z "$mean" ]; then
              echo "::error file=$f::impossibile misurare il volume"
              fail=1
              continue
            fi
            ok=$(python3 -c "print(1 if float('$mean') > -60 else 0)")
            if [ "$ok" = "1" ]; then
              echo "ok   $f  ($mean dB)"
            else
              echo "::error file=$f::clip muta o quasi ($mean dB)"
              fail=1
            fi
          done
          exit $fail

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila la APK di debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Carica la APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voicevault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
